<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栗の木成長記録</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>栗の木成長記録</h1>
    </header>
    <main>
        <div class="trees-grid">
            <div class="tree" data-tree-id="1">
                <img src="images/tree-placeholder.png" alt="栗の木 1">
                <p>木 1</p>
            </div>
            <div class="tree" data-tree-id="2">
                <img src="images/tree-placeholder.png" alt="栗の木 2">
                <p>木 2</p>
            </div>
            <div class="tree" data-tree-id="3">
                <img src="images/tree-placeholder.png" alt="栗の木 3">
                <p>木 3</p>
            </div>
            <div class="tree" data-tree-id="4">
                <img src="images/tree-placeholder.png" alt="栗の木 4">
                <p>木 4</p>
            </div>
            <div class="tree" data-tree-id="5">
                <img src="images/tree-placeholder.png" alt="栗の木 5">
                <p>木 5</p>
            </div>
        </div>
    </main>
    <footer class="footer-image">
        <img src="images/footer-placeholder.png" alt="栗園の風景">
    </footer>
    <script src="app.js"></script>
</body>
</html>
